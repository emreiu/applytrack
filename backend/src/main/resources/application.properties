spring.application.name=backend

# Local defaults, matching .env.example / docker-compose.yml's postgres service.
# Full env-var-only / no-default separation follows in E1-S02.
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:applytrack}
spring.datasource.username=${POSTGRES_USER:applytrack}
spring.datasource.password=${POSTGRES_PASSWORD:applytrack}
